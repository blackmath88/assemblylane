<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build Atlas — Architecture as Journey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ─── Header ─────────────────────────────────────────── -->
  <header id="header">
    <div id="header-left">
      <div id="logo">
        <div id="logo-mark">BA</div>
        <span id="logo-name">Build Atlas</span>
      </div>
      <div id="project-pill">
        <div id="project-pill-dot"></div>
        <span>Stakeholder Atlas &mdash; worked example</span>
      </div>
    </div>

    <div id="header-right">
      <span id="thread-hint"></span>
      <button id="inspo-btn" title="Paste inspiration from Claude">✦ Inspiration</button>
      <div id="mode-toggle">
        <button class="mode-btn active" data-mode="assembled">Assembled</button>
        <button class="mode-btn" data-mode="exploded">Exploded</button>
      </div>
    </div>
  </header>

  <!-- ─── AI Inspiration panel ──────────────────────────── -->
  <div id="inspo-backdrop" aria-hidden="true"></div>
  <div id="inspo-panel" role="dialog" aria-modal="true" aria-label="AI Inspiration">
    <div id="inspo-header">
      <div id="inspo-title">
        <div id="inspo-logo">✦</div>
        <span>AI Inspiration</span>
        <span id="inspo-source-tag">from Claude</span>
      </div>
      <button id="inspo-close" title="Close panel">✕</button>
    </div>

    <div id="inspo-input-area">
      <label id="inspo-label" for="inspo-textarea">Paste Claude's response below, then click Display.</label>
      <textarea id="inspo-textarea" placeholder="Paste inspiration from Claude here…" rows="8" spellcheck="false"></textarea>
      <div id="inspo-actions">
        <button id="inspo-render-btn" class="inspo-action-btn primary">Display</button>
        <button id="inspo-clear-btn" class="inspo-action-btn">Clear</button>
      </div>
    </div>

    <div id="inspo-output" hidden>
      <div id="inspo-output-header">
        <span id="inspo-output-label">Claude's Inspiration</span>
        <button id="inspo-edit-btn" class="inspo-action-btn">Edit</button>
      </div>
      <div id="inspo-output-content"></div>
    </div>
  </div>

  <!-- ─── Main ───────────────────────────────────────────── -->
  <div id="main">

    <!-- Canvas (scrollable) -->
    <div id="canvas">

      <!-- SVG connector lines overlay -->
      <svg id="connector-svg" aria-hidden="true"></svg>

      <!-- Zone legend -->
      <div id="canvas-intro"></div>

      <!-- Stage rows injected by app.js -->
      <div id="stage-container"></div>

      <div id="canvas-footer"></div>
    </div>

    <!-- Detail panel -->
    <div id="detail-panel" role="complementary" aria-label="Node detail">
      <div id="detail-inner">
        <!-- Content injected by app.js -->
      </div>
    </div>

  </div><!-- /main -->
</div><!-- /app -->

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
